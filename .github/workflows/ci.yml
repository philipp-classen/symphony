name: Crystal CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        crystal: [latest, nightly]
    runs-on: ubuntu-latest

    steps:
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Download source
        uses: actions/checkout@v4

      - name: Check code formatting
        run: make format-check

      - name: Install dependencies
        run: shards install

      - name: Lint with Ameba
        if: matrix.crystal == 'latest' # skipped: Ameba 1.7.0 reports false problems (Style/VerboseBlock) when the nightly compiler builds it
        run: make linter

      - name: Run unit tests
        run: make test

      - name: Run E2E tests
        run: make test-e2e
